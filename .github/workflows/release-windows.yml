name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag cần build/publish, ví dụ v1.2.0"
        required: true
        type: string
      operation:
        description: "Chỉ đồng bộ ghi chú hoặc chỉ publish khi Release chưa tồn tại"
        required: true
        default: sync-notes
        type: choice
        options:
          - sync-notes
          - publish-if-missing

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'publish-if-missing' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        if: env.RELEASE_OPERATION == 'publish-if-missing'
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "$env:RELEASE_TAG") {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion"
          }

          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV

      - name: Prepare release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseNotesPath = "docs/RELEASE-NOTES-$env:PACKAGE_VERSION.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath)) {
            $releaseNotesPath = Join-Path $env:RUNNER_TEMP "RELEASE-NOTES-$env:PACKAGE_VERSION.md"
            $notesEndpoint = "repos/${{ github.repository }}/contents/docs/RELEASE-NOTES-$env:PACKAGE_VERSION.md?ref=${{ github.event.repository.default_branch }}"
            gh api $notesEndpoint -H "Accept: application/vnd.github.raw+json" |
              Set-Content -LiteralPath $releaseNotesPath -Encoding utf8NoBOM

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to download release notes for $env:RELEASE_TAG"
            }
          }

          if ((Get-Item -LiteralPath $releaseNotesPath).Length -eq 0) {
            throw "Release notes are empty: $releaseNotesPath"
          }

          "RELEASE_NOTES_PATH=$releaseNotesPath" >> $env:GITHUB_ENV

      - name: Run regression tests
        if: env.RELEASE_OPERATION == 'publish-if-missing'
        run: npm test

      - name: Build Windows installer
        if: env.RELEASE_OPERATION == 'publish-if-missing'
        run: npm run build:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish complete GitHub Release
        if: env.RELEASE_OPERATION == 'publish-if-missing'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            "release/PNG-Bundle-Mockup-Setup-$env:PACKAGE_VERSION.exe",
            "release/PNG-Bundle-Mockup-Setup-$env:PACKAGE_VERSION.exe.blockmap",
            "release/latest.yml"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }
          }

          gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            $remoteAssetNames = @(gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect existing Release $env:RELEASE_TAG"
            }

            $missingAssetNames = @($assets | ForEach-Object { Split-Path -Leaf $_ } | Where-Object { $_ -notin $remoteAssetNames })
            if ($missingAssetNames.Count -gt 0) {
              throw "Release $env:RELEASE_TAG already exists but is incomplete ($($missingAssetNames -join ', ')). Refusing to replace public assets; publish a new patch version instead."
            }

            Write-Output "Release $env:RELEASE_TAG already has all required assets; leaving them unchanged."
          } else {
            gh release create "$env:RELEASE_TAG" $assets --verify-tag --repo "${{ github.repository }}" --title "PNG Bundle Mockup $env:RELEASE_TAG" --notes-file "$env:RELEASE_NOTES_PATH"
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release publish failed with exit code $LASTEXITCODE"
            }
          }

      - name: Sync release notes only
        if: env.RELEASE_OPERATION == 'sync-notes'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Release $env:RELEASE_TAG does not exist"
          }

          gh release edit "$env:RELEASE_TAG" --repo "${{ github.repository }}" --title "PNG Bundle Mockup $env:RELEASE_TAG" --notes-file "$env:RELEASE_NOTES_PATH"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release notes sync failed with exit code $LASTEXITCODE"
          }

      - name: Keep a workflow copy of update artifacts
        if: env.RELEASE_OPERATION == 'publish-if-missing'
        uses: actions/upload-artifact@v4
        with:
          name: PNG-Bundle-Mockup-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            release/PNG-Bundle-Mockup-Setup-*.exe
            release/PNG-Bundle-Mockup-Setup-*.exe.blockmap
            release/latest.yml

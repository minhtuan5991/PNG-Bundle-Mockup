name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag cần build/publish, ví dụ v1.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "$env:RELEASE_TAG") {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion"
          }

      - name: Run regression tests
        run: npm test

      - name: Build Windows installer
        run: npm run build:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish complete GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $assets = @(
            "release/PNG-Bundle-Mockup-Setup-$packageVersion.exe",
            "release/PNG-Bundle-Mockup-Setup-$packageVersion.exe.blockmap",
            "release/latest.yml"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }
          }

          gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" $assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create "$env:RELEASE_TAG" $assets --verify-tag --generate-notes --repo "${{ github.repository }}" --title "PNG Bundle Mockup $env:RELEASE_TAG"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publish failed with exit code $LASTEXITCODE"
          }

          $releaseNotesPath = "docs/RELEASE-NOTES-$packageVersion.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath)) {
            $releaseNotesPath = Join-Path $env:RUNNER_TEMP "RELEASE-NOTES-$packageVersion.md"
            $notesEndpoint = "repos/${{ github.repository }}/contents/docs/RELEASE-NOTES-$packageVersion.md?ref=${{ github.event.repository.default_branch }}"
            gh api $notesEndpoint -H "Accept: application/vnd.github.raw+json" |
              Set-Content -LiteralPath $releaseNotesPath -Encoding utf8NoBOM

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to download release notes for $env:RELEASE_TAG"
            }
          }

          gh release edit "$env:RELEASE_TAG" --repo "${{ github.repository }}" --title "PNG Bundle Mockup $env:RELEASE_TAG" --notes-file $releaseNotesPath
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release notes update failed with exit code $LASTEXITCODE"
          }

      - name: Keep a workflow copy of update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PNG-Bundle-Mockup-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            release/PNG-Bundle-Mockup-Setup-*.exe
            release/PNG-Bundle-Mockup-Setup-*.exe.blockmap
            release/latest.yml
